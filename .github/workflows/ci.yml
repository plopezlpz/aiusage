name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l ./*.go)"
      - if: runner.os == 'Linux'
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go build ./...
      - if: runner.os == 'macOS'
        run: swift test --package-path macos
      - if: runner.os == 'Linux'
        run: shellcheck scripts/macos.sh
